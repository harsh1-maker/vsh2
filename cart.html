<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - VSH Tank Cleaning</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="navbar">
  <div class="logo">
    <a href="index.html">VSH Tank Cleaning</a>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="prices.html">Prices</a>
    <a href="about.html">About Us</a>
    <a href="areas.html">Areas</a>
    <a href="guides.html">Guides</a>
    <a href="reviews.html">Reviews</a>
    <a href="contact.html">Contact</a>
    <a href="cart.html" class="active cart-link">
      Cart <span id="cart-count">0</span>
    </a>
  </nav>
</header>

<main class="page">

  <section class="hero-section">
    <h1>Your Cart</h1>
    <p>Review your tank cleaning services before booking.</p>
  </section>

  <div id="cart-root"></div>

  <section class="checkout-section">

    <h2>Booking Details</h2>

    <form id="booking-form">

      <div class="form-row">

        <div class="form-group">
          <label>Full Name</label>
          <input
            type="text"
            id="customer-name"
            required
            placeholder="Enter your name">
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input
            type="tel"
            id="customer-phone"
            required
            placeholder="Enter your phone number">
        </div>

      </div>

      <div class="form-group">
        <label>Service Address</label>
        <textarea
          id="customer-address"
          required
          placeholder="Enter complete service address"></textarea>
      </div>

      <div class="form-group">
        <label>Preferred Date</label>
        <input
          type="date"
          id="service-date"
          required>
      </div>

      <h3>Payment Method</h3>

      <div class="payment-options">

        <label class="payment-option">
          <input
            type="radio"
            name="payment-method"
            value="online"
            checked>

          <span>
            <strong>Pay Online</strong>
            <small>Get an additional 5% discount</small>
          </span>
        </label>

        <label class="payment-option">
          <input
            type="radio"
            name="payment-method"
            value="after-service">

          <span>
            <strong>Pay After Service</strong>
            <small>Pay after the cleaning is completed</small>
          </span>
        </label>

      </div>

      <div id="order-summary"></div>

      <button
        type="submit"
        class="checkout-btn">
        Continue to Payment
      </button>

    </form>

  </section>

</main>

<script src="js/app.js"></script>

</body>
</html>
